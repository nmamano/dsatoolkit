# /etc/tmpfiles.d/dsatoolkit.conf. The directory for the site's Unix socket, which Caddy
# connects to. The directory is 0755 and the site creates the socket with mode 0666, so any
# local user can connect: the socket serves only what the public site serves (the same
# choice as bigOspeedrun, lead decision 2026-10-16).
# dsa-site is a dedicated system user, created once:
#   useradd --system --no-create-home --shell /usr/sbin/nologin dsa-site
# Its numeric uid and gid go in /opt/dsatoolkit/release.env as DSA_UID and DSA_GID.
d /run/dsatoolkit 0755 dsa-site dsa-site -
